name: publish

# Builds one image and pushes it to quay.io/panda-coop/ubi10-<image>. Called by release.yml
# and rebuild.yml.

on:
  workflow_call:
    inputs:
      image:
        description: Image directory
        required: true
        type: string
      base-image:
        description: Overrides ARG BASE_IMAGE (repo:tag@digest); empty keeps the Containerfile pin
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    # GitHub runs an explicit `bash` as `bash --noprofile --norc -eo pipefail`; the implicit
    # default is only `bash -e`, which lets a failing command inside a pipe go unnoticed.
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The OIDC subject becomes `…:environment:quay`, the one the Quay robot federation trusts;
    # the environment admits main only.
    environment: quay
    # The quay environment's variables, under the names containerimage.py reads.
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
    # One release of an image at a time, so two releases never share an epoch (ADR 0001).
    concurrency:
      group: publish-${{ inputs.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
          # No dependencies to cache: the scripts use the standard library only.
          enable-cache: false

      - name: publish
        id: push
        env:
          IMAGE: ${{ inputs.image }}
          BASE_IMAGE: ${{ inputs.base-image }}
        run: uv run --script .github/scripts/containerimage.py publish "$IMAGE"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.55.0

      - name: sign
        env:
          REF: ${{ steps.push.outputs.ref }}
        # Keyless: the certificate binds the signature to this workflow run through GitHub OIDC.
        run: cosign sign --yes "$REF"

      - name: sbom
        env:
          REF: ${{ steps.push.outputs.ref }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" scan "registry:$REF" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
