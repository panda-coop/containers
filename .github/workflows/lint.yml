name: lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          # The hadolint hook needs a local binary; build.yml lints each changed Containerfile.
          SKIP: hadolint
        with:
          prek-version: 0.5.9
          extra-args: --all-files

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
          # No dependencies to cache: the scripts use the standard library only.
          enable-cache: false
      - run: uvx ruff@0.17.5 check .github/scripts
      - run: uvx ruff@0.17.5 format --check .github/scripts
      - run: uvx pytest@9.2.0 .github/scripts
