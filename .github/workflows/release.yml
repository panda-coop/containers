name: release

# A push to main releases every changed image.

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # GitHub runs an explicit `bash` as `bash --noprofile --norc -eo pipefail`; the implicit
    # default is only `bash -e`, which lets a failing command inside a pipe go unnoticed.
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "images=$(.github/scripts/changed-images.sh "$BEFORE")" >> "$GITHUB_OUTPUT"

  publish:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      image: ${{ matrix.image }}
