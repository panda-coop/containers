# The health site: containerimage.py scan --health .github/health/docs writes the pages, then
# `zensical build -f .github/health/zensical.toml` renders them into .github/health/site.
[project]
site_name = "Containers"
site_description = "Each image's health grade, missing security updates and packages"
site_url = "https://panda-coop.github.io/containers/"
repo_url = "https://github.com/panda-coop/containers"
repo_name = "panda-coop/containers"
edit_uri = "edit/main/.github/health/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["health.css"]
# No nav: the automatic one lists Getting started (index.md), Image health (health.md)
# and every page under images/.

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.tooltips",
  "content.code.copy",
]

[project.theme.icon]
logo = "lucide/container"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
toc.permalink = true
